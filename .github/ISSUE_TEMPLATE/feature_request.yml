name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: moment
    attributes:
      label: The moment you needed it
      description: Describe what you were doing when the feature was missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, other tools or other ways to reach the goal.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
