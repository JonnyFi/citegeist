name: CI

# Linux runners cost a tenth of macOS minutes. When the Actions minutes are used up,
# the local pre-push hook (pnpm verify) is the gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync
        working-directory: workers/convert
      - run: pnpm --filter @citegeist/reader exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          # Model downloads and full-corpus conversion stay out of CI; run them locally with -m ''.
          PYTEST_ADDOPTS: "-m 'not slow and not network'"
          CITEGEIST_SKIP_MODELS: "1"
