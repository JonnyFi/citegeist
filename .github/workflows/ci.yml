name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync
        working-directory: workers/convert
      - run: pnpm --filter @citegeist/reader exec playwright install chromium
      - run: pnpm verify
