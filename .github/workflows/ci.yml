name: CI

# Linux runners cost a tenth of macOS minutes. When the Actions minutes are used up,
# the local pre-push hook (pnpm verify) is the gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync
        working-directory: workers/convert
      - run: pnpm --filter @citegeist/reader exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          # Model downloads and full-corpus conversion stay out of CI; run them locally with -m ''.
          PYTEST_ADDOPTS: "-m 'not slow and not network'"
          CITEGEIST_SKIP_MODELS: "1"
