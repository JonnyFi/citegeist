name: CI

# The verify job is the required status check for main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: No committed gitlinks
        # A gitlink (mode 160000) is a nested repo or agent worktree staged by accident.
        run: |
          links=$(git ls-files -s | awk '$1 == "160000" {print $4}')
          if [ -n "$links" ]; then
            echo "::error::Nested repos or agent worktrees are committed. Remove them with git rm --cached:"
            echo "$links"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: uv sync
        working-directory: workers/convert
      - run: pnpm --filter @citegeist/reader exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          # Model downloads and full-corpus conversion stay out of CI; run them locally with -m ''.
          PYTEST_ADDOPTS: "-m 'not slow and not network'"
          CITEGEIST_SKIP_MODELS: "1"
