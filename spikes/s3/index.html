<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S3 highlight anchoring</title>
    <style>
      body { margin: 0; font: 14px system-ui; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 160px; height: 100vh; }
      header { grid-column: 1 / 3; padding: 6px 10px; background: #eee; display: flex; gap: 12px; align-items: center; }
      #pdf, #reflow { overflow: auto; padding: 8px; }
      #reflow { font: 15px/1.5 Georgia, serif; border-left: 1px solid #ccc; }
      #out { grid-column: 1 / 3; margin: 0; overflow: auto; background: #111; color: #9f9; padding: 6px; font-size: 11px; }
      .page { position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 0 4px #888; }
      .page canvas { position: absolute; inset: 0; }
      .hl { position: absolute; inset: 0; pointer-events: none; }
      .quad { position: absolute; background: rgba(255, 220, 0, 0.45); }
      mark.exact { background: #ffe14d; }
      mark.fuzzy { background: #ffb347; }
    </style>
  </head>
  <body>
    <header>
      <b>S3 anchoring spike</b>
      <button id="save">Highlight selection</button>
      <label><input type="checkbox" id="perturb" /> simulate re-conversion</label>
      <span id="info"></span>
    </header>
    <div id="pdf"></div>
    <div id="reflow"></div>
    <pre id="out"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
