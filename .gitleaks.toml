# Secret scan configuration (gitleaks). Run `pnpm secrets` for the working tree.
title = "citegeist"

[extend]
useDefault = true

# Bibliographic citekeys look like "luhmann1984soziale" and trip the generic-api-key rule.
[[allowlists]]
description = "Citekeys and library keys in code, tests and docs"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)cite_?key''', '''libraryKey''']

# Lowercase test ids such as `key: "mock-library-1"` in test files.
[[allowlists]]
description = "Lowercase identifiers assigned to key in test files"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''\.test\.tsx?$''']
regexTarget = "match"
regexes = ['''^key\W+"[a-z0-9-]+"$''']
