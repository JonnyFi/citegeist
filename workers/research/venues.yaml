# Venue tiers per field. Format:  Canonical name: [aliases]   (quote aliases containing commas)
# Matching is case-insensitive after normalisation: "&" = "and", punctuation, years,
# ordinals ("36th", "Thirty-Second"), "Proceedings" and "Annual" are ignored. Add aliases as OpenAlex spells venue names.

