[project]
name = "citegeist-convert"
version = "0.0.0"
description = "Document conversion worker for citegeist"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citegeist_convert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
