[project]
name = "citegeist-convert"
version = "0.1.0"
description = "Document conversion worker for citegeist"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.148.0",
  "ocrmac==1.0.1; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
  "pypdf>=6.2",
  "fonttools>=4.50",
  "lxml>=5",
  "beautifulsoup4>=4.12",
  "trafilatura>=2.0",
  "jsonschema>=4.23",
  "requests>=2.32",
]

[project.scripts]
citegeist-convert = "citegeist_convert.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "rapidfuzz>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citegeist_convert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: converts the whole fixture corpus (minutes). Run with `uv run pytest -m slow` or `uv run pytest -m ''` for everything.",
  "network: needs network access (fixture download, HTML sources, model download)",
]
