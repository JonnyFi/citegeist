# Packaging of the desktop app with electron-builder. `pnpm package` (repo root) builds the UI and
# the Electron bundles first and then runs this config. The result is an unsigned, ad-hoc signed
# arm64 app at apps/desktop/dist/mac-arm64/citegeist.app.
#
# Native code cannot be loaded from inside app.asar, so every module with a .node or .dylib file
# is unpacked next to it. The core runs as a utilityProcess from out/main/core.js and finds them
# there. better-sqlite3 ships N-API prebuilds, so nothing is rebuilt.
appId: app.citegeist.desktop
productName: citegeist
directories:
  output: dist
npmRebuild: false
files:
  - out/**
  - package.json
  # stand-in for the sharp image library (stubs/sharp/package.json): @huggingface/transformers
  # imports it at load time, and the real package would bring LGPL libvips into the app. pnpm
  # links the stub (overrides in pnpm-workspace.yaml), which the dependency walk of
  # electron-builder does not follow, so it is added by hand.
  - from: ../../stubs/sharp
    to: node_modules/sharp
    filter:
      - package.json
      - index.js
  # The Claude Code and Codex binaries (about 560 MB) do not ship with the app: the chat adapters
  # run the `claude` and `codex` the user installed. Only the JavaScript of the adapters and of
  # the Agent SDK stays.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/node_modules/@openai/codex-*/**"
  - "!**/node_modules/@napi-rs/canvas-{android-*,darwin-x64,linux-*,win32-*}/**"
  - "!**/node_modules/sqlite-vec-{darwin-x64,linux-*,windows-*}/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/**"
  - "!**/node_modules/better-sqlite3/prebuilds/{win32-*,linux*,darwin-x64}.node"
  # onnxruntime-web (145 MB of WASM) is bundled into transformers.node.mjs already; the runtime
  # loads onnxruntime-node, never this package
  - "!**/node_modules/onnxruntime-web/**"
  # pdf.js: the core imports legacy/build/pdf.mjs only; the viewer, the browser build and the
  # image decoders belong to the UI bundle in apps/ui/dist
  - "!**/node_modules/pdfjs-dist/{build,web,types,image_decoders,legacy/web,legacy/image_decoders}/**"
  # workspace packages: core, ops, schema, server and the packages behind them are bundled into
  # out/main, so their sources, tests and fixtures stay out of the archive
  - "!**/node_modules/@citegeist/**"
  - "!**/node_modules/zod/src/**"
  # source maps, type declarations, docs, tests and CI files of every dependency
  - "!**/node_modules/**/*.{map,d.ts,d.mts,d.cts,tsbuildinfo}"
  - "!**/node_modules/**/{README,CHANGELOG,HISTORY,CONTRIBUTING}{,.md,.markdown,.txt}"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples,.github}/**"
extraResources:
  # license and attribution files: LICENSE and NOTICE of citegeist, plus the license texts of
  # material that is bundled into the JavaScript or the renderer and would otherwise lose them
  # (the OFL texts of the fonts, the CPAL/AGPL text of citeproc-js)
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../ui/node_modules/@fontsource-variable/inter/LICENSE
    to: licenses/fonts/Inter-OFL.txt
  - from: ../ui/node_modules/@fontsource-variable/newsreader/LICENSE
    to: licenses/fonts/Newsreader-OFL.txt
  - from: ../ui/node_modules/@fontsource-variable/jetbrains-mono/LICENSE
    to: licenses/fonts/JetBrainsMono-OFL.txt
  - from: ../../licenses/citeproc-js-LICENSE.txt
    to: licenses/citeproc-LICENSE.txt
  # the `cg` launcher: runs out/main/cg.js with the app binary as Node. install.sh links
  # ~/.local/bin/cg to it and the chat puts its folder on the PATH of the agent.
  - from: resources/cg
    to: bin/cg
  # the built renderer of apps/ui, loaded from file://; main/index.ts looks in Resources/ui/dist
  - from: ../ui/dist
    to: ui/dist
  # the Python conversion worker; the app installs its environment from these sources on first run
  - from: ../../workers/convert
    to: workers/convert
    filter:
      - pyproject.toml
      - uv.lock
      - README.md
      - src/**
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # the literature search (issue #50): standard-library Python, run with uv in its own environment
  - from: ../../workers/research
    to: workers/research
    filter:
      - pyproject.toml
      - uv.lock
      - NOTICE.md
      - "*.yaml"
      - scripts/**
      # opendraft, Text to LaTeX and the legacy import wait for issue #61 and have no operation yet
      - "!vendor/**"
      - "!scripts/word_latex.py"
      - "!scripts/latex_export.py"
      - "!scripts/opendraft_bridge.py"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@parcel/watcher*/**"
  # semantic search: the ONNX runtime and the sqlite-vec extension with its platform binary
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/sqlite-vec/**"
  - "**/node_modules/sqlite-vec-*/**"
  # the chat agents run as child processes: the ACP adapters and the JavaScript they import
  - "**/node_modules/@agentclientprotocol/**"
  - "**/node_modules/@anthropic-ai/**"
  - "**/node_modules/@openai/**"
  # JavaScript that the adapters import; they run from the unpacked tree, outside the archive
  - "**/node_modules/zod/**"
  - "**/node_modules/diff/**"
  # CSL styles and locales that @citegeist/cite reads next to the bundle
  - out/main/vendor/**
# Chromium locale packs of languages the UI does not offer (German and English only)
electronLanguages:
  - en
  - de
afterPack: ./scripts/after-pack.cjs
# Electron fuses (M8), flipped in the binary before it is signed. They close ways to run other
# code inside the signed app: NODE_OPTIONS and the inspector flags are ignored, and the app code
# loads from app.asar only.
# runAsNode stays on on purpose: the chat adapters (Claude Code, Codex) run as the app binary
# with ELECTRON_RUN_AS_NODE (packages/chat/src/backends.ts). A test pins both sides.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.productivity
  # Generated from build/icon.svg by scripts/make-icon.sh and committed. It lands in
  # Contents/Resources as icon.icns (CFBundleIconFile). build/ itself is not packaged.
  icon: build/icon.icns
  target:
    - target: dir
      arch: arm64
  # Ad-hoc signature ("-") by default: the app starts without a developer account. scripts/package-mac.sh
  # overrides it with the self-signed identity "citegeist local signing" when the keychain has it, so
  # the signature, and with it the Accessibility grant, stays the same across builds.
  identity: "-"
  extendInfo:
    NSAppleEventsUsageDescription: citegeist tippt eingefügte Zitate über System Events in die App, aus der du die Palette geöffnet hast.
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
